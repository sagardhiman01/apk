name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      EXPO_PUBLIC_API_URL: https://ramsunenergy.online/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ramsun-mobile/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: |
          cd ramsun-mobile
          npm install --legacy-peer-deps

      - name: Generate Android project (Expo Prebuild)
        run: |
          cd ramsun-mobile
          npx --yes expo prebuild --platform android --clean

      - name: Build APK (Release)
        run: |
          cd ramsun-mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ramsun-mobile/android/app/build/outputs/apk/release/*.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Ramsun Solar Latest APK
          body: Latest production APK build from main branch
          files: ramsun-mobile/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
